server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html text/css application/javascript;
  gzip_min_length 512;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
